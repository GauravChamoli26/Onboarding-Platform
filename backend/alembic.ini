# ============================================================================
# alembic.ini — migration tool configuration
# ----------------------------------------------------------------------------
# The database URL is deliberately left blank here. It is read from the
# DATABASE_URL environment variable in alembic/env.py instead, so that
# credentials never sit in a committed file (see .gitignore, ADR-014).
# ============================================================================

[alembic]
script_location = alembic

# Migration filenames get a UTC timestamp prefix so ordering is obvious on disk
# and merge conflicts between parallel branches are visible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

# Blank on purpose. env.py supplies the real URL from the environment.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
